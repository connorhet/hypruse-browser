<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tracks fixture</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }
      .app {
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: 1fr 72px;
        height: 100vh;
      }
      nav {
        grid-row: 1;
        grid-column: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .shelf {
        display: block;
        padding: 6px;
        cursor: pointer;
      }
      main {
        grid-row: 1;
        grid-column: 2;
        overflow-y: auto;
      }
      footer {
        grid-row: 2;
        grid-column: 1 / 3;
        border-top: 1px solid #ccc;
        padding: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 48px 1fr 80px;
        align-items: center;
        height: 56px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <nav>
        <a href="#home">Home</a>
        <div class="shelf">Made for you</div>
        <div class="shelf">Recently played</div>
        <div class="shelf">Podcasts</div>
      </nav>
      <main id="main">
        <h1>Liked Songs</h1>
        <div role="grid" aria-label="Liked Songs"><div role="rowgroup" id="rows"></div></div>
      </main>
      <footer><span id="now">Nothing playing</span> <button aria-label="Pause">||</button></footer>
    </div>
    <script>
      const rows = document.getElementById('rows');
      for (let n = 1; n <= 50; n += 1) {
        rows.insertAdjacentHTML(
          'beforeend',
          `<div role="row" class="row" aria-rowindex="${n}">
             <div role="gridcell"><button class="play" aria-label="Play Song ${n} by Artist ${n}">&#9654;</button></div>
             <div role="gridcell"><a href="#track-${n}">Song ${n}</a> <span>Artist ${n}</span></div>
             <div role="gridcell">3:${String(n).padStart(2, '0')}</div>
           </div>`,
        );
      }
      rows.addEventListener('click', (event) => {
        const button = event.target.closest('.play');
        if (button) {
          document.getElementById('now').textContent =
            'Now playing: ' + button.getAttribute('aria-label').replace(/^Play /, '');
        }
      });
      for (const shelf of document.querySelectorAll('.shelf')) {
        shelf.addEventListener('click', () => {
          document.getElementById('now').textContent = 'Shelf: ' + shelf.textContent;
        });
      }
    </script>
  </body>
</html>
