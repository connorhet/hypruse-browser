<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Results fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        height: 56px;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #ccc;
      }
      .result {
        height: 110px;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
      }
      .banner {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: 5;
        width: 320px;
        height: 160px;
        padding: 12px;
        background: #222;
        color: #fff;
      }
      #covered {
        position: fixed;
        right: 30px;
        bottom: 30px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/results.html">Home</a>
      <button aria-label="Main menu"><svg width="16" height="16"></svg></button>
      <form role="search" action="/results.html">
        <input name="q" placeholder="Search results" />
      </form>
    </header>
    <h1>Results for lofi</h1>
    <main id="results"></main>
    <button id="covered">Hidden behind the banner</button>
    <div class="banner">We use cookies <button>Accept cookies</button></div>
    <div aria-hidden="true"><button>Aria hidden button</button></div>
    <button style="visibility: hidden">Invisible button</button>
    <script>
      const results = document.getElementById('results');
      for (let n = 1; n <= 20; n += 1) {
        results.insertAdjacentHTML(
          'beforeend',
          `<div class="result">
             <h3><a class="title" href="/target.html?n=${n}">Result number ${n}</a></h3>
             <span class="meta">Channel ${n}</span>
             <button class="more" aria-label="More actions">&#8942;</button>
           </div>`,
        );
      }
    </script>
  </body>
</html>
